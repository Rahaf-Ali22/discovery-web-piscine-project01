<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration Form</title>
</head>
<body>
<form>
<label for="fullname">Full Name</label>
<input type="text" id="fullname" name="fullname" required minlength="3">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
<label for="password">Password</label>
<input type="password" id="password" name="password" required minlength="8">
<input type="radio" id="web" name="track" value="web" required>
<label for="web">Web Development</label>
<input type="radio" id="cybersecurity" name="track" value="cybersecurity">
<label for="cybersecurity">Cybersecurity</label>
<input type="checkbox" id="agreement" name="agreement" required>
<label for="agreement">I agree to the terms</label>
<label for="country">Country</label>
<select id="country" name="country" required>
    <option value="jordan">Jordan</option>
    <option value="saudi-arabia">Saudi Arabia</option>
    <option value="uae">United Arab Emirates</option>
</select>
<label for="about">About You</label>
<textarea id="about" name="about" required minlength="10"></textarea>
<button type="submit">Register</button> 
</form>
</body>
</html>
